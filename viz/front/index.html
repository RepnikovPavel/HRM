<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hrm metrics viz</title>
<style>
  :root {
    --bg: #141b28; --bg2: #1b2434; --bg3: #232e42; --panel: #1e2739;
    --fg: #d5dbe7; --fg2: #7d8699; --up: #2ea88a; --down: #e5484d;
    --accent: #4f8ef7; --border: #2b3650;
    --shadow: 0 4px 18px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; }
  button { font: inherit; }
  #topbar { display: flex; align-items: center; gap: 10px; padding: 5px 12px;
    background: var(--bg2); border-bottom: 1px solid var(--border); }
  #topbar .brand { font-weight: 600; color: var(--accent); margin-right: 6px; }
  #topbar .hint { color: var(--fg2); font-size: 12px; }
  #topbar .spacer { flex: 1; }
  .ctl { background: var(--bg2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .ctl:hover { border-color: var(--accent); color: var(--accent); }
  #wpicker { position: relative; }
  #wpicker-menu { position: absolute; right: 0; top: 30px; z-index: 100;
    background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); padding: 6px; display: none; min-width: 220px; }
  #wpicker-menu button { display: block; width: 100%; text-align: left;
    background: none; border: 0; color: var(--fg); padding: 7px 10px;
    border-radius: 6px; cursor: pointer; }
  #wpicker-menu button:hover { background: var(--bg2); }
  #wpicker-menu .hint { display: block; color: var(--fg2); font-size: 11px; }
  #board { position: relative; flex: 1; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  .tile { position: absolute; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); display: flex; flex-direction: column;
    overflow: hidden; min-width: 260px; min-height: 180px; }
  .tile.focus { border-color: var(--accent); }
  .tile-head { display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    cursor: move; user-select: none; }
  .tile-head .ttl { font-size: 12px; color: var(--fg); flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-head .x { border: 0; background: none; color: var(--fg2);
    cursor: pointer; padding: 0 4px; border-radius: 4px; }
  .tile-head .x:hover { color: var(--down); background: var(--bg3); }
  .tile-body { position: relative; flex: 1; overflow: hidden; }
  .tile-rs { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px;
    cursor: nwse-resize; z-index: 5; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="brand">hrm viz</span>
    <span class="hint">sudoku-extreme: exact accuracy vs wall time (свеча = OHLC за таймфрейм)</span>
    <span class="spacer"></span>
    <div id="wpicker">
      <button class="ctl" id="wpicker-btn">+ виджет</button>
      <div id="wpicker-menu"></div>
    </div>
  </div>
  <div id="board"></div>
</div>
<script type="module" src="/front/shell/shell.js"></script>
</body>
</html>
